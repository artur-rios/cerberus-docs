baseURL = "https://docs.artur-rios.tech/cerberus-docs/"
title = "Cerberus"
# `locale`, not the deprecated `languageCode` (renamed in Hugo v0.158.0).
locale = "en-us"

enableGitInfo = false
enableRobotsTXT = true

# Docsy renders section landing pages from each section's _index.md and
# needs the section tree, so only taxonomies are excluded.
disableKinds = ["taxonomy", "term"]

[module]
  [module.hugoVersion]
    extended = true
    # `locale` and `languages.*.label` arrived in 0.158.0.
    min = "0.158.0"
  [[module.imports]]
    path = "github.com/google/docsy"

[markup]
  [markup.goldmark.renderer]
    # Docsy's shortcodes emit HTML; Goldmark drops it otherwise.
    unsafe = true
  [markup.highlight]
    # Class-based highlighting so code blocks follow the light/dark mode;
    # the per-mode stylesheets come from assets/scss/_styles_project.scss.
    noClasses = false
    lineNos = false
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 3

[languages]
  [languages.en]
    label = "English"
    contentDir = "content/en"
    weight = 1
    title = "Cerberus"
    [languages.en.params]
      description = "An end-to-end encrypted vault for credentials, passwords, notes and custom sensitive records."

[params]
  copyright.authors = "Artur Rios | [Artur Rios Attribution License](https://github.com/artur-rios/cerberus-docs/blob/main/LICENSE)"
  github_repo = "https://github.com/artur-rios/cerberus-docs"
  github_branch = "main"
  offlineSearch = true

  [params.mermaid]
    enable = true
    # Docsy v0.15.0's loader predates Mermaid 12; "latest" would pick it up.
    version = "11.17.2"
    # Draw diagrams at natural size; the stylesheet lets wide ones scroll.
    [params.mermaid.flowchart]
      useMaxWidth = false
    [params.mermaid.sequence]
      useMaxWidth = false
    [params.mermaid.class]
      useMaxWidth = false
    [params.mermaid.state]
      useMaxWidth = false

  [params.ui]
    showLightDarkModeMenu = true
    sidebar_menu_compact = true
    sidebar_menu_foldable = true
    sidebar_search_disable = false
    navbar_logo = false
    breadcrumb_disable = false
    [params.ui.feedback]
      enable = false
    [params.ui.readingtime]
      enable = true

  [params.links]
    [[params.links.developer]]
      name = "cerberus-api"
      url = "https://github.com/artur-rios/cerberus-api"
      icon = "fab fa-github"
      desc = "The .NET API that stores the encrypted vault"
    [[params.links.developer]]
      name = "cerberus-ui"
      url = "https://github.com/artur-rios/cerberus-ui"
      icon = "fab fa-github"
      desc = "The Flutter client for web, Windows, Linux and Android"
    [[params.links.developer]]
      name = "cerberus-docs"
      url = "https://github.com/artur-rios/cerberus-docs"
      icon = "fab fa-github"
      desc = "This site"
    [[params.links.user]]
      name = "Heimdall"
      url = "https://docs.artur-rios.tech/heimdall-docs/"
      icon = "fa-solid fa-shield-halved"
      desc = "The identity system Cerberus signs in through"

# Documentation adds itself from its own front matter.
[[menu.main]]
  name = "API Reference"
  weight = 20
  pageRef = "/docs/reference/rest-api"
[[menu.main]]
  name = "GitHub"
  weight = 50
  url = "https://github.com/artur-rios/cerberus-api"
  pre = "<i class='fab fa-github'></i>"
